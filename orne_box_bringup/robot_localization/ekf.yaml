ekf_localization_node:
  frequency: 30  # EKF の更新頻度 [Hz]
  two_d_mode: true  # 2D モード (Z軸の動きを無視)
  publish_tf: true  # odom -> base_link の TF を配信する

  # センサーデータのトピック
  odom0: /icart_mini/odom
  odom0_config: [true, true, false,  # x, y, z
                 false, false, true, # roll, pitch, yaw
                 true, true, false,  # vx, vy, vz
                 false, false, true, # vroll, vpitch, vyaw
                 false, false, false] # ax, ay, az

  imu0: /imu/data
  imu0_config: [false, false, false,  # x, y, z
                true, true, true,    # roll, pitch, yaw
                false, false, false, # vx, vy, vz
                true, true, true,    # vroll, vpitch, vyaw
                true, true, true]    # ax, ay, az
  imu0_differential: false
  imu0_remove_gravitational_acceleration: true

  # 出力される座標系 (TF)
  map_frame: map
  odom_frame: odom
  base_link_frame: base_link
  world_frame: odom  # 位置の基準座標系 (通常 `odom`)

  # 初期状態の共分散行列 (低い値ほど確信度が高い)
  initial_covariance: [1e-9, 0, 0, 0, 0, 0, 0, 1e-9, 0, 0, 0, 0, 0, 0, 1e-9, 0, 0, 0, 0, 0, 0, 1e-9, 0, 0, 0, 0, 0, 0, 1e-9]
